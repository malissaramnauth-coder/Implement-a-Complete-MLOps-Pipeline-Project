project:
  name: heart_disease_mlops
  experiment_name: heart_disease_experiments

data:
  dataset_path: data/raw/heart.csv
  raw_data_path: data/raw/heart.csv
  train_path: data/processed/train.csv
  test_path: data/processed/test.csv
  target: target
  positive_label: 1
  drop_columns: []
  random_state: 42

features:
  numeric:
    - age
    - trestbps
    - chol
    - thalach
    - oldpeak
    - ca
  categorical:
    - sex
    - cp
    - fbs
    - restecg
    - exang
    - slope
    - thal

preprocessing:
  numeric_imputer: median
  scale_numeric: true
  categorical_imputer: most_frequent
  onehot_handle_unknown: ignore

model:
  model_type: random_forest
  n_estimators: 200
  max_depth: 8
  min_samples_split: 4
  min_samples_leaf: 2
  class_weight: balanced

metrics:
  accuracy: 0.75
  recall: 0.60

mlflow:
  tracking_uri: file:./mlruns
  artifact_path: model

drift:
  report_path: reports/drift_report.html
  prediction_drift_threshold: 0.30
  production_fraction: 0.25
  random_state: 42